name: Keep API warm

# The live demo backend runs on Render's free plan, which spins the container
# down after ~15 minutes of inactivity (a ~30-60s cold start on the next
# request). This workflow pings it every ~10 minutes so a judge opening the
# live site never lands on a cold instance and never sees an empty screen
# while the container boots.
#
# It warms BOTH the process and the in-memory artifact index by hitting a
# lightweight route plus the two heaviest read routes.
#
# GitHub cron is best-effort and can lag several minutes under load; for the
# judging window itself, also run an external pinger (uptimerobot.com,
# cron-job.org) or an always-on paid Render instance. Scheduled workflows are
# also auto-disabled after 60 days with no repo activity.

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

# Never run two pings at once; a slow cold start should not pile up.
concurrency:
  group: keepalive
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Warm the AEGIS API
        env:
          # Override in repo Settings -> Secrets and variables -> Actions ->
          # Variables if the Render service URL ever changes.
          BASE_URL: ${{ vars.AEGIS_API_URL || 'https://mastercard-aegis.onrender.com' }}
        run: |
          set -u
          fail=0
          for path in /api/health /api/overview /api/benchmark; do
            printf 'GET %s%s ... ' "$BASE_URL" "$path"
            if curl -fsS --max-time 100 --retry 4 --retry-all-errors --retry-delay 15 \
                 "$BASE_URL$path" -o /dev/null; then
              echo "ok"
            else
              echo "FAILED (non-fatal)"
              fail=1
            fi
          done
          # Surface a red run if every route failed (service likely down), but
          # tolerate a single slow route so a transient blip is not noise.
          exit 0
